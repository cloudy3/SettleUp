name: settle_up
description: "A new Flutter project."

publish_to: "none"

version: 1.2.0+3

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  cloud_firestore: ^6.0.0
  flex_color_scheme: ^8.3.0
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  firebase_storage: ^13.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.0
  image_picker: ^1.1.2
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12
  test: ^1.25.15

  cloud_firestore_platform_interface: any
  firebase_auth_platform_interface: any
flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    - assets/images/
    - assets/avatars/
